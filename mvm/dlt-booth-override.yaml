services:
  dlt-booth:
    build: !reset null
    image: ghcr.io/sedimark/dlt-booth:latest
    networks: !override
      - sedimark_shared
      - dlt-booth-net
    profiles: !reset null
    env_file: !reset null
    environment: !override
      RUST_LOG: ${DLT_RUST_LOG:-info}
      RUST_BACKTRACE: ${DLT_RUST_BACKTRACE:-1}
      HOST_ADDRESS: ${DLT_HOST_ADDRES:-0.0.0.0}
      HOST_PORT: ${DLT_HOST_ADDRES:-8085}
      NODE_URL: ${DLT_NODE_URL}
      FAUCET_API_ENDPOINT: ${DLT_FAUCET_API_ENDPOINT}
      RPC_PROVIDER: ${DLT_RPC_PROVIDER}
      CHAIN_ID: ${DLT_CHAIN_ID}
      ISSUER_URL: ${DLT_ISSUER_URL}
      KEY_STORAGE_STRONGHOLD_SNAPSHOT_PATH: ${DLT_KEY_STORAGE_STRONGHOLD_SNAPSHOT_PATH}
      KEY_STORAGE_STRONGHOLD_PASSWORD: ${DLT_KEY_STORAGE_STRONGHOLD_PASSWORD}
      WALLET_STRONGHOLD_SNAPSHOT_PATH: ${DLT_WALLET_STRONGHOLD_SNAPSHOT_PATH}
      WALLET_STRONGHOLD_PASSWORD: ${DLT_WALLET_STRONGHOLD_PASSWORD}
      FACTORY_SC_ADDRESS: ${DLT_BOOTH_FACTORY_SC_ADDRESS}
      FIXED_RATE_EXCHANGE_SC_ADDRESS: ${DLT_BOOTH_FIXED_RATE_EXCHANGE_SC_ADDRESS}
      DB_USER: ${DLT_BOOTH_DB_USER:-postgres}
      DB_PASSWORD: ${DLT_BOOTH_DB_PASSWORD:-dlt_booth}
      DB_NAME: dlt_booth
      DB_HOST: "postgres" # "postgres" for deploying, "127.0.0.1 " for dev
      DB_PORT: 5432
      DB_MAX_POOL_SIZE: 16

  postgres:
    image: postgres:16
    profiles: !reset null
    env_file: !reset null
    environment: !override
      POSTGRES_USER: ${DLT_BOOTH_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DLT_BOOTH_DB_PASSWORD:-dlt_booth}
      POSTGRES_DB: dlt_booth
    volumes: !override
      - dlt_postgresdata:/var/lib/postgresql/data:ro=true,U=true
      - ./dlt-booth/dlt-booth/sql/dbinit.sql:/docker-entrypoint-initdb.d/dbinit.sql:ro=true,U=true
      # Below is a workaround for those running Docker on macOS with Colima. Due to this issue:
      # https://github.com/abiosoft/colima/issues/844
      # you need to copy the DB init script to a location that Colima can access. By default,
      # /tmp/colima is always mounted, so do `cp ./dlt-booth/dlt-booth/sql/dbinit.sql /tmp/colima/dlt_dbinit.sql`
      # and uncomment the line below to use it.
      # - /tmp/colima/dlt_dbinit.sql:/docker-entrypoint-initdb.d/dbinit.sql:ro=true,U=true
    networks: !override
      - sedimark_shared
      - dlt-booth-net

networks:
  dlt-booth-net:
    driver: bridge

volumes:
  dlt_postgresdata:
